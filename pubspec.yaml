name: in_app_review_kit
description: >-
  Intelligently manage Google Play and App Store in-app reviews in Flutter.
  Fluent eligibility rules, event tracking, cooldowns, and a debug screen —
  with zero hardcoded defaults.
version: 1.0.0
homepage: https://github.com/darkmintis/review_kit
repository: https://github.com/darkmintis/review_kit
issue_tracker: https://github.com/darkmintis/review_kit/issues
documentation: https://github.com/darkmintis/review_kit#readme

topics:
  - in-app-review
  - rating
  - review
  - play-store
  - app-store

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  in_app_review: ^2.0.9
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
